<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>dinobot desktop · design system</title>
		<script>
			try {
				const t = localStorage.getItem("dn-theme");
				if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
				const d = new URLSearchParams(location.search).get("dino") || localStorage.getItem("dn-dino");
				document.documentElement.dataset.dino = d === "ptero" || d === "brachio" || d === "tricera" ? d : "rex";
			} catch {}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
