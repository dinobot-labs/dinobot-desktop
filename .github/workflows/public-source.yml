name: public-source
on:
  pull_request:
    # Only prose: source Markdown, executable docs and fixtures still run CI.
    paths-ignore:
      - 'README*.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'
      - 'docs/*.md'
      - 'docs/wiki/**/*.md'
      - 'wiki/**/*.md'
      - '.github/ISSUE_TEMPLATE/*.md'
      - '.github/*[Tt][Ee][Mm][Pp][Ll][Aa][Tt][Ee].md'
  push:
    # Only prose: source Markdown, executable docs and fixtures still run CI.
    paths-ignore:
      - 'README*.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'
      - 'docs/*.md'
      - 'docs/wiki/**/*.md'
      - 'wiki/**/*.md'
      - '.github/ISSUE_TEMPLATE/*.md'
      - '.github/*[Tt][Ee][Mm][Pp][Ll][Aa][Tt][Ee].md'
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check:public
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
  required:
    if: always()
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all validation jobs
        env:
          RESULT: ${{ needs.validate.result }}
        run: test "$RESULT" = success
